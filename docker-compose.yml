
services:
  backend:
    image: jenkins-backend:${BUILD_NUMBER:-latest}
    build:
      context: ./application/backend
      dockerfile: Dockerfile
    container_name: jenkins-backend-container
    expose:
      - "5000"
    networks:
      - jenkins-network

  frontend:
    image: jenkins-frontend:${BUILD_NUMBER:-latest}
    build:
      context: ./application/frontend
      dockerfile: Dockerfile
    container_name: jenkins-frontend-container
    ports:
      - "8000:80"
    depends_on:
      - backend
    networks:
      - jenkins-network

networks:
  jenkins-network:
    driver: bridge
