
server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /health {
        proxy_pass http://backend:5000/health;
    }

    location /api/info {
        proxy_pass http://backend:5000/api/info;
    }
}
